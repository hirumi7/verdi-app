name: verdi_mobile
description: Verdi Flutter customer application, development presentation.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: 9.1.1
  freezed_annotation: 3.1.0
  get_it: 8.3.0
  injectable: 3.0.0
  auto_route: 11.2.0
  intl: ^0.20.3
  verdi_core:
    path: packages/verdi_core
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.16.1
  freezed: 4.0.1
  injectable_generator: 3.1.3
  auto_route_generator: 10.6.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/catalog/
    - assets/illustrations/empty-plants.png
